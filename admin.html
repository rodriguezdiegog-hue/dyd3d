<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | D&D 3D</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
        .gold-border { border-color: #d4af37; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const AdminPanel = () => {
            const [products, setProducts] = useState([]);
            const [newProduct, setNewProduct] = useState({
                title: '',
                category: 'regalos',
                description: '',
                price: '',
                image: '',
                featured: false
            });
            const [showJson, setShowJson] = useState(false);

            useEffect(() => {
                fetch('products.json')
                    .then(res => res.json())
                    .then(data => setProducts(data))
                    .catch(err => console.error("No se pudo cargar el archivo products.json. Usa el botón 'Agregar' para empezar una lista nueva."));
            }, []);

            const addProduct = (e) => {
                e.preventDefault();
                const id = `prod_${Date.now()}`;
                setProducts([...products, { ...newProduct, id }]);
                setNewProduct({ title: '', category: 'regalos', description: '', price: '', image: '', featured: false });
            };

            const deleteProduct = (id) => {
                setProducts(products.filter(p => p.id !== id));
            };

            const generateJson = () => {
                const jsonString = JSON.stringify(products, null, 2);
                navigator.clipboard.writeText(jsonString);
                alert("¡JSON copiado al portapapeles! Ahora solo pégalo en tu archivo products.json");
            };

            return (
                <div className="min-h-screen p-6 md:p-12">
                    <div className="max-w-5xl mx-auto">
                        {/* Header */}
                        <div className="flex items-center justify-between mb-12 border-b border-yellow-900/50 pb-6">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-yellow-600 rounded-lg flex items-center justify-center border-2 border-yellow-400/50">
                                    <div className="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-t-[20px] border-t-black"></div>
                                </div>
                                <h1 className="text-3xl font-black tracking-tighter">D&D 3D <span className="text-yellow-500">Admin</span></h1>
                            </div>
                            <button
                                onClick={() => setShowJson(!showJson)}
                                className="bg-yellow-600 text-black px-6 py-2 rounded-full font-bold hover:bg-yellow-500 transition-all"
                            >
                                {showJson ? 'Ver Tabla' : 'Generar Archivo JSON'}
                            </button>
                        </div>

                        {showJson ? (
                            <div className="animate-in fade-in slide-in-from-bottom-4 duration-300">
                                <div className="bg-slate-900 p-6 rounded-3xl border border-yellow-900/30">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-bold text-yellow-500">Contenido de products.js</h2>
                                        <button
                                            onClick={generateJson}
                                            className="bg-white text-black px-4 py-1 rounded-lg text-sm font-bold hover:bg-yellow-400 transition-all"
                                        >
                                            Copiar Todo
                                        </button>
                                    </div>
                                    <textarea
                                        readOnly
                                        className="w-full h-96 bg-black text-green-500 font-mono p-4 rounded-xl border border-yellow-900/30 outline-none"
                                        value={`window.PRODUCTS_DATA = ${JSON.stringify(products, null, 2)};`}
                                    ></textarea>
                                    <p className="mt-4 text-slate-400 text-sm text-center">
                                        Copia este texto y reemplaza todo el contenido de tu archivo <span className="text-yellow-500 font-bold">products.js</span>
                                    </p>
                                </div>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-12">
                                {/* Formulario */}
                                <div className="lg:col-span-1">
                                    <div className="bg-slate-900 p-6 rounded-3xl border border-yellow-900/30 sticky top-12">
                                        <h2 className="text-xl font-bold mb-6 text-white">Agregar Producto</h2>
                                        <form onSubmit={addProduct} className="space-y-4">
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Título</label>
                                                <input
                                                    type="text"
                                                    value={newProduct.title}
                                                    onChange={e => setNewProduct({...newProduct, title: e.target.value})}
                                                    className="w-full bg-black border border-yellow-900/30 rounded-xl px-4 py-2 outline-none focus:border-yellow-500 text-white"
                                                    placeholder="Ej: Maceta Suculenta"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Categoría</label>
                                                <select
                                                    value={newProduct.category}
                                                    onChange={e => setNewProduct({...newProduct, category: e.target.value})}
                                                    className="w-full bg-black border border-yellow-900/30 rounded-xl px-4 py-2 outline-none focus:border-yellow-500 text-white"
                                                >
                                                    <option value="hogar">Hogar y Jardín</option>
                                                    <option value="regalos">Regalos y Souvenirs</option>
                                                    <option value="accesorios">Accesorios</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Descripción</label>
                                                <textarea
                                                    value={newProduct.description}
                                                    onChange={e => setNewProduct({...newProduct, description: e.target.value})}
                                                    className="w-full bg-black border border-yellow-900/30 rounded-xl px-4 py-2 outline-none focus:border-yellow-500 text-white"
                                                    placeholder="Describe el producto..."
                                                    rows="3"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Precio</label>
                                                <input
                                                    type="text"
                                                    value={newProduct.price}
                                                    onChange={e => setNewProduct({...newProduct, price: e.target.value})}
                                                    className="w-full bg-black border border-yellow-900/30 rounded-xl px-4 py-2 outline-none focus:border-yellow-500 text-white"
                                                    placeholder="Ej: Desde $10"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">URL de Imagen</label>
                                                <input
                                                    type="text"
                                                    value={newProduct.image}
                                                    onChange={e => setNewProduct({...newProduct, image: e.target.value})}
                                                    className="w-full bg-black border border-yellow-900/30 rounded-xl px-4 py-2 outline-none focus:border-yellow-500 text-white"
                                                    placeholder="images/producto.jpg"
                                                    required
                                                />
                                            </div>
                                            <button type="submit" className="w-full bg-yellow-600 text-black font-bold py-3 rounded-xl hover:bg-yellow-500 transition-all">
                                                Agregar al Catálogo
                                            </button>
                                        </form>
                                    </div>
                                </div>

                                {/* Tabla de Productos */}
                                <div className="lg:col-span-2">
                                    <div className="bg-slate-900 rounded-3xl border border-yellow-900/30 overflow-hidden">
                                        <table className="w-full text-left border-collapse">
                                            <thead className="bg-black text-yellow-600 text-xs uppercase font-bold">
                                                <tr>
                                                    <th className="px-6 py-4">Producto</th>
                                                    <th className="px-6 py-4">Precio</th>
                                                    <th className="px-6 py-4">Acción</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-yellow-900/20">
                                                {products.map(p => (
                                                    <tr key={p.id} className="hover:bg-white/5 transition-colors">
                                                        <td className="px-6 py-4">
                                                            <div className="flex items-center gap-3">
                                                                <img src={p.image} className="w-10 h-10 rounded-lg object-cover bg-black" />
                                                                <div>
                                                                    <div className="font-bold text-white">{p.title}</div>
                                                                    <div className="text-xs text-slate-500">{p.category}</div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td className="px-6 py-4 text-yellow-500 font-medium">{p.price}</td>
                                                        <td className="px-6 py-4">
                                                            <button
                                                                onClick={() => deleteProduct(p.id)}
                                                                className="text-red-500 hover:text-red-400 text-sm font-bold transition-colors"
                                                            >
                                                                Eliminar
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {products.length === 0 && (
                                                    <tr>
                                                        <td colSpan="3" className="px-6 py-12 text-center text-slate-500">
                                                            No hay productos cargados. ¡Agrega el primero!
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPanel />);
    </script>
</body>
</html>
