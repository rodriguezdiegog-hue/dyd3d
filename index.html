        // Imagen tolerante: si el archivo no carga (por ejemplo .jpg vs .JPG o .jpeg),
        // prueba otras extensiones compatibles con Android antes de mostrar un aviso.
        const FALLBACK_EXTS = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG'];
        const SmartImg = ({ src, alt, className }) => {
            const base = src.replace(/\.[^./]+$/, '');
            const candidates = [src, ...FALLBACK_EXTS.map(e => `${base}.${e}`).filter(u => u !== src)];
            const [idx, setIdx] = useState(0);
            useEffect(() => { setIdx(0); }, [src]);
            if (idx >= candidates.length) {
                return <div className="w-full h-full flex items-center justify-center text-slate-500 text-sm text-center px-4">Imagen no disponible</div>;
            }
            return (
                <img
                    src={candidates[idx]}
                    alt={alt}
                    className={className}
                    loading="lazy"
                    decoding="async"
                    onError={() => setIdx(i => i + 1)}
                />
            );
        };

        const ProductCard = ({ product }) => {
            const [currentImg, setCurrentImg] = useState(0);
            const touchStartX = React.useRef(null);
            const images = product.images || (product.image ? [product.image] : []);

            const nextImg = (e) => {
                e.stopPropagation();
                if (images.length > 1) {
                    setCurrentImg((prev) => (prev + 1) % images.length);
                }
            };

            const prevImg = (e) => {
                e.stopPropagation();
                if (images.length > 1) {
                    setCurrentImg((prev) => (prev - 1 + images.length) % images.length);
                }
            };

            // Deslizar con el dedo para cambiar de foto
            const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
            const onTouchEnd = (e) => {
                if (touchStartX.current === null || images.length < 2) return;
                const dx = e.changedTouches[0].clientX - touchStartX.current;
                touchStartX.current = null;
                if (Math.abs(dx) > 40) {
                    setCurrentImg((prev) => dx < 0 ? (prev + 1) % images.length : (prev - 1 + images.length) % images.length);
                }
            };

            return (
                <div className="group rounded-3xl bg-black border border-yellow-900/30 overflow-hidden md:hover:border-yellow-600/50 transition-all md:hover:-translate-y-2 flex flex-col">
                    <div className="aspect-square overflow-hidden relative p-4 bg-slate-900/30 touch-pan-y" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>

                                <button onClick={nextImg} aria-label="Foto siguiente" className="w-11 h-11 rounded-full bg-black/80 text-white flex items-center justify-center active:bg-yellow-600 md:hover:bg-yellow-600 transition-all shadow-xl border-2 border-yellow-500 font-bold text-lg pointer-events-auto">❯</button>

                        )}

                                ))}

                        )}

                                <h2 className="text-3xl sm:text-4xl md:text-6xl font-bold mb-6 tracking-tighter text-white">¿Tienes un <span className="text-yellow-500">diseño propio?</span></h2>
                                <p className="text-slate-400 text-lg mb-12 leading-relaxed">
                                    Además de nuestro catálogo, imprimimos cualquier archivo <span className="text-white font-bold"></span> que necesites. Desde piezas técnicas hasta adornos personalizados.
                                </p>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-left max-w-md mx-auto lg:mx-0">
                                    <div className="flex items-center gap-3 text-slate-300">
                                        <span className="text-yellow-600">✓</span> <span>Análisis de viabilidad</span>
                                    </div>
                                    <div className="flex items-center gap-3 text-slate-300">
                                        <span className="text-yellow-600">✓</span> <span>Optimización de capas</span>
                                    </div>
                                    <div className="flex items-center gap-3 text-slate-300">
                                        <span className="text-yellow-600">✓</span> <span>Variedad de colores</span>
                                    </div>
                                    <div className="flex items-center gap-3 text-slate-300">
                                        <span className="text-yellow-600">✓</span> <span>Presupuestos exactos</span>
                                    </div>
                                </div>
                            </div>
                            <div className="lg:w-1/2 w-full">
                                <form className="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6 bg-black p-5 sm:p-8 rounded-3xl border border-yellow-900/30" onSubmit={handleSubmit}>
                                    <div className="space-y-2">
                                        <label className="text-sm font-medium text-slate-400 ml-1">Nombre</label>
                                        <input
                                            type="text"
                                            autoComplete="name"
                                            className="w-full px-5 py-3 rounded-2xl bg-slate-950 border border-yellow-900/30 focus:border-yellow-500 outline-none transition-all text-white"
                                            placeholder="Tu nombre"
                                            value={formData.nombre}
                                            onChange={e => setFormData({...formData, nombre: e.target.value})}
                                            required
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-sm font-medium text-slate-400 ml-1">Email</label>
                                        <input
                                            type="email"
                                            inputMode="email"
                                            autoComplete="email"
                                            className="w-full px-5 py-3 rounded-2xl bg-slate-950 border border-yellow-900/30 focus:border-yellow-500 outline-none transition-all text-white"
                                            placeholder="email@ejemplo.com"
                                            value={formData.email}
                                            onChange={e => setFormData({...formData, email: e.target.value})}
                                            required
                                        />
                                    </div>
                                    <div className="sm:col-span-2 space-y-2">
                                        <label className="text-sm font-medium text-slate-400 ml-1">Sube tu archivo</label>
                                        <div className="relative group">
                                            <div className="w-full px-5 py-8 rounded-2xl bg-slate-950 border-2 border-dashed border-yellow-900/50 group-hover:border-yellow-600 transition-all flex flex-col items-center justify-center gap-3 cursor-pointer">
                                                <span className="text-2xl">📤</span>
                                                <span className="text-sm text-slate-500 group-hover:text-slate-300">Adjunta tu modelo 3D aquí</span>
                                            </div>
                                            <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" />
                                        </div>
                                    </div>
                                    <div className="sm:col-span-2 space-y-2">
                                        <label className="text-sm font-medium text-slate-400 ml-1">Detalles del pedido</label>
                                        <textarea
                                            rows="3"
                                            className="w-full px-5 py-3 rounded-2xl bg-slate-950 border border-yellow-900/30 focus:border-yellow-500 outline-none transition-all text-white"
                                            placeholder="Color, cantidad, dimensiones..."
                                            value={formData.detalles}
                                            onChange={e => setFormData({...formData, detalles: e.target.value})}
                                            required
                                        ></textarea>
                                    </div>
                                    <button type="submit" className="sm:col-span-2 bg-yellow-600 hover:bg-yellow-500 text-black py-4 rounded-2xl font-bold text-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                                        📦 Enviar Solicitud
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="py-12 border-t border-yellow-900/30 bg-black">
                <div className="container mx-auto px-4 sm:px-6 flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-left">
                    <div className="flex items-center gap-2">
                        <img src="logo.png" alt="D&D 3D Logo" className="w-8 h-8 object-contain" />
                        <span className="font-bold tracking-tighter text-white">D&D 3D</span>
                    </div>
                    <p className="text-slate-500 text-sm">© 2026 Todos los derechos reservados.</p>
                </div>
            </footer>
        );

        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [products, setProducts] = useState(INITIAL_PRODUCTS);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);

                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="bg-black text-slate-100">
                    <Navbar scrolled={scrolled} />
                    <Hero />
                    <Catalog products={products} />
                    <CustomOrder />
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
